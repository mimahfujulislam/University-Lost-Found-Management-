<html>
<head>
    <title>UniLostFound - Search Items</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: #2563eb;
        }

        a:hover {
            color: #1d4ed8;
        }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 0;
        }

        .navbar-content {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: #475569;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            color: #0f172a;
            font-size: 28px;
        }

        .page-header p {
            color: #64748b;
            margin-top: 5px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .card h2 {
            color: #0f172a;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group select {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            background: #ffffff;
            color: #1e293b;
            font-size: 14px;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="date"]:focus,
        .form-group select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .btn {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e8eefc;
            color: #2563eb;
        }

        .btn-secondary:hover {
            background: #dbe5fb;
        }

        .results-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .results-card h2 {
            color: #0f172a;
            margin-bottom: 20px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        .results-table th {
            background: #f8fafc;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            padding: 13px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .results-table td {
            padding: 13px;
            text-align: center;
            font-size: 14px;
            color: #475569;
            border-bottom: 1px solid #e5e7eb;
        }

        .results-table tr:hover {
            background: #f8fafc;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #e8eefc;
            color: #2563eb;
            font-size: 12px;
            font-weight: 600;
        }

        .action-link {
            color: #2563eb;
            font-weight: 600;
            font-size: 13px;
        }

        .action-link:hover {
            color: #1d4ed8;
        }

        .back-link {
            display: inline-block;
            margin-top: 0;
            font-size: 14px;
        }

        .footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            border-top: 1px solid #e5e7eb;
        }

        @media (max-width: 600px) {
            .navbar-content {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .container {
                width: 92%;
                margin: 25px auto;
            }

            .card,
            .results-card {
                padding: 22px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="navbar-content">

            <div class="logo">
                UniLostFound
            </div>

            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="profile.html">My Profile</a>
                <a href="../login.html">Logout</a>
            </div>

        </div>

    </nav>

    <main class="container">

        <div class="page-header">

            <h1>Search Lost & Found Items</h1>

            <p>
                Search and filter reported lost and found items.
            </p>

        </div>

        <div class="card">

            <h2>Search & Filter</h2>

            <form action="#" method="get">

                <div class="form-group">

                    <label>Item Name</label>

                    <input
                        type="text"
                        name="search"
                        placeholder="Enter item name"
                    >

                </div>

                <div class="form-group">

                    <label>Type</label>

                    <select name="type">

                        <option value="">All</option>
                        <option value="Lost">Lost</option>
                        <option value="Found">Found</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Category</label>

                    <select name="category">

                        <option value="">All Categories</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Documents">Documents</option>
                        <option value="Personal Items">Personal Items</option>
                        <option value="Books">Books</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Others">Others</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Location</label>

                    <input
                        type="text"
                        name="location"
                        placeholder="Enter location"
                    >

                </div>

                <div class="form-group">

                    <label>Date</label>

                    <input
                        type="date"
                        name="date"
                    >

                </div>

                <div class="form-actions">

                    <input
                        type="submit"
                        value="Search"
                        class="btn btn-primary"
                    >

                    <input
                        type="reset"
                        value="Clear"
                        class="btn btn-secondary"
                    >

                </div>

            </form>

        </div>

        <div class="results-card">

            <h2>Search Results</h2>

            <div class="table-container">

                <table class="results-table">

                    <tr>
                        <th>Item ID</th>
                        <th>Item Name</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Location</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>

                </table>

            </div>

        </div>

        <a href="dashboard.html" class="back-link">
            Back to Dashboard
        </a>

    </main>

    <footer class="footer">
        &copy; 2026 UniLostFound - University Lost & Found Management System
    </footer>

</body>
</html>
