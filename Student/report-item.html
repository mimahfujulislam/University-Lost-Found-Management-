<html>
<head>
    <title>UniLostFound - Report Item</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: #2563eb;
        }

        a:hover {
            color: #1d4ed8;
        }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 0;
        }

        .navbar-content {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: #475569;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            color: #0f172a;
            font-size: 28px;
        }

        .page-header p {
            color: #64748b;
            margin-top: 5px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .card h2 {
            color: #0f172a;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            background: #ffffff;
            color: #1e293b;
            font-size: 14px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="date"]:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 5px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #475569;
            font-size: 14px;
        }

        .radio-option input {
            accent-color: #2563eb;
        }

        .file-input {
            width: 100%;
            padding: 10px 0;
            color: #475569;
            font-size: 14px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .btn {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e8eefc;
            color: #2563eb;
        }

        .btn-secondary:hover {
            background: #dbe5fb;
        }

        .back-link {
            display: inline-block;
            margin-top: 0;
            font-size: 14px;
        }

        .footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            border-top: 1px solid #e5e7eb;
        }

        @media (max-width: 600px) {
            .navbar-content {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .container {
                width: 92%;
                margin: 25px auto;
            }

            .card {
                padding: 22px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="navbar-content">

            <div class="logo">
                UniLostFound
            </div>

            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="../profile.html">My Profile</a>
                <a href="../login.html">Logout</a>
            </div>

        </div>

    </nav>

    <main class="container">

        <div class="page-header">

            <h1>Report an Item</h1>

            <p>
                Report a lost or found item to help reunite it with its owner.
            </p>

        </div>

        <div class="card">

            <h2>Item Information</h2>

            <form action="#" method="post" enctype="multipart/form-data">

                <div class="form-group">

                    <label>Report Type</label>

                    <div class="radio-group">

                        <label class="radio-option">
                            <input
                                type="radio"
                                name="item_type"
                                value="Lost"
                                required
                            >
                            Lost
                        </label>

                        <label class="radio-option">
                            <input
                                type="radio"
                                name="item_type"
                                value="Found"
                            >
                            Found
                        </label>

                    </div>

                </div>

                <div class="form-group">

                    <label>Item Name</label>

                    <input
                        type="text"
                        name="item_name"
                        placeholder="Enter item name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Category</label>

                    <select name="category" required>

                        <option value="">Select Category</option>
                        <option>Electronics</option>
                        <option>Documents</option>
                        <option>Personal Items</option>
                        <option>Books</option>
                        <option>Accessories</option>
                        <option>Others</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Description</label>

                    <textarea
                        name="description"
                        placeholder="Describe the item"
                        rows="5"
                        required
                    ></textarea>

                </div>

                <div class="form-group">

                    <label>Date</label>

                    <input
                        type="date"
                        name="item_date"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Location</label>

                    <input
                        type="text"
                        name="location"
                        placeholder="Where was it lost/found?"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Item Image</label>

                    <input
                        type="file"
                        name="item_image"
                        accept="image/*"
                        class="file-input"
                    >

                </div>

                <div class="form-actions">

                    <input
                        type="submit"
                        value="Submit Report"
                        class="btn btn-primary"
                    >

                    <input
                        type="reset"
                        value="Clear"
                        class="btn btn-secondary"
                    >

                </div>

            </form>

        </div>

        <a href="dashboard.html" class="back-link">
            Back to Dashboard
        </a>

    </main>

    <footer class="footer">
        &copy; 2026 UniLostFound - University Lost & Found Management System
    </footer>

</body>
</html>
