<!DOCTYPE html>
<html>
<head>
    <title>UniLostFound - My Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: #2563eb;
        }

        a:hover {
            color: #1d4ed8;
        }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 0;
        }

        .navbar-content {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: #475569;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            color: #0f172a;
            font-size: 28px;
        }

        .page-header p {
            color: #64748b;
            margin-top: 5px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
        }

        fieldset {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 20px;
        }

        legend {
            color: #2563eb;
            font-weight: bold;
            padding: 0 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 8px 5px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            background: #ffffff;
            color: #1e293b;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        input[readonly] {
            background: #f8fafc;
            color: #64748b;
        }

        .btn {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e8eefc;
            color: #2563eb;
        }

        .btn-secondary:hover {
            background: #dbe5fb;
        }

        .security-link {
            display: block;
            padding: 12px 15px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 7px;
            margin-top: 10px;
        }

        .security-link:hover {
            background: #eff6ff;
        }

        .back-link {
            display: inline-block;
            font-size: 14px;
        }

        .footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            border-top: 1px solid #e5e7eb;
        }

        @media (max-width: 600px) {
            .navbar-content {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .container {
                width: 92%;
                margin: 25px auto;
            }

            .card {
                padding: 20px;
            }

            td {
                display: block;
                width: 100%;
            }

            .btn {
                width: 100%;
                margin-bottom: 8px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="navbar-content">

            <div class="logo">
                UniLostFound
            </div>

            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="profile.html">My Profile</a>
                <a href="login.html">Logout</a>
            </div>

        </div>

    </nav>

    <main class="container">

        <div class="page-header">

            <h1>My Profile</h1>

            <p>
                View and update your account information.
            </p>

        </div>

        <div class="card">

            <form action="#" method="post">

                <fieldset>

                    <legend>Profile Information</legend>

                    <table>

                        <tr>
                            <td>
                                <label for="fullname">
                                    Full Name
                                </label>
                            </td>

                            <td>
                                <input
                                    type="text"
                                    id="fullname"
                                    name="fullname"
                                    placeholder="Full Name"
                                    required
                                >
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="student_id">
                                    Student ID
                                </label>
                            </td>

                            <td>
                                <input
                                    type="text"
                                    id="student_id"
                                    name="student_id"
                                    placeholder="Student ID"
                                    readonly
                                >
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="email">
                                    Email
                                </label>
                            </td>

                            <td>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="Email"
                                    required
                                >
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="role">
                                    Role
                                </label>
                            </td>

                            <td>
                                <input
                                    type="text"
                                    id="role"
                                    name="role"
                                    value="Student"
                                    readonly
                                >
                            </td>
                        </tr>

                        <tr>
                            <td></td>

                            <td>
                                <input
                                    type="submit"
                                    value="Update Profile"
                                    class="btn btn-primary"
                                >

                                <input
                                    type="reset"
                                    value="Reset"
                                    class="btn btn-secondary"
                                >
                            </td>
                        </tr>

                    </table>

                </fieldset>

            </form>

        </div>

        <div class="card">

            <fieldset>

                <legend>Account Security</legend>

                <a
                    href="change-password.html"
                    class="security-link"
                >
                    Change Password
                </a>

            </fieldset>

        </div>

        <a href="dashboard.html" class="back-link">
            Back to Dashboard
        </a>

    </main>

    <footer class="footer">
        &copy; 2026 UniLostFound - University Lost & Found Management System
    </footer>

</body>
</html>
