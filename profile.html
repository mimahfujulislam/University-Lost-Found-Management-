<html>
<head>
    <title>UniLostFound - My Profile</title>
</head>

<body>

    <h1>UniLostFound</h1>

    <table width="100%" cellpadding="10">
        <tr>
            <td>
                <b>My Profile</b>
            </td>

            <td align="right">
                <a href="dashboard.html">Dashboard</a> |
                <a href="login.html">Logout</a>
            </td>
        </tr>
    </table>

    <hr>

    <h2>My Profile</h2>

    <form action="#" method="post">

        <fieldset>
            <legend><b>Profile Information:</b></legend>

            <table cellpadding="8">

                <tr>
                    <td><b>Full Name</b></td>
                    <td>:
                        <input
                            type="text"
                            name="fullname"
                            placeholder="Full Name"
                            required
                        >
                    </td>
                </tr>

                <tr>
                    <td><b>Student ID</b></td>
                    <td>:
                        <input
                            type="text"
                            name="student_id"
                            placeholder="Student ID"
                            readonly
                        >
                    </td>
                </tr>

                <tr>
                    <td><b>Email</b></td>
                    <td>:
                        <input
                            type="email"
                            name="email"
                            placeholder="Email"
                            required
                        >
                    </td>
                </tr>

                <tr>
                    <td><b>Role</b></td>
                    <td>:
                        <input
                            type="text"
                            name="role"
                            value="Student"
                            readonly
                        >
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Update Profile">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </fieldset>

    </form>

    <br>

    <fieldset>
        <legend><b>Account Security:</b></legend>

        <p>
            <a href="change-password.html">Change Password</a>
        </p>

        <p>
            <a href="forgot-password.html">Reset Password</a>
        </p>

    </fieldset>

    <br>

    <a href="dashboard.html">Back to Dashboard</a>

</body>
</html>
