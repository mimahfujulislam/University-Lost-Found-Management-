<html>
<head>
    <title>UniLostFound - My Claims</title>
</head>

<body>

    <h1>UniLostFound</h1>

    <table width="100%" cellpadding="10">
        <tr>
            <td>
                <b>My Claims</b>
            </td>

            <td align="right">
                <a href="dashboard.html">Dashboard</a> |
                <a href="../profile.html">My Profile</a> |
                <a href="../login.html">Logout</a>
            </td>
        </tr>
    </table>

    <hr>

    <h2>Submit a Claim</h2>

    <form action="#" method="post">

        <fieldset>
            <legend><b>Claim Information:</b></legend>

            <table cellpadding="8">

                <tr>
                    <td><b>Item ID</b></td>
                    <td>:
                        <input
                            type="text"
                            name="item_id"
                            required
                        >
                    </td>
                </tr>

                <tr>
                    <td><b>Claim Reason</b></td>
                    <td>:
                        <textarea
                            name="claim_reason"
                            rows="5"
                            cols="30"
                            placeholder="Explain why this item belongs to you"
                            required
                        ></textarea>
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Submit Claim">
                        <input type="reset" value="Clear">
                    </td>
                </tr>

            </table>

        </fieldset>

    </form>

    <br>

    <h2>My Claims</h2>

    <fieldset>
        <legend><b>Claim History:</b></legend>

        <table border="1" cellpadding="10" cellspacing="0">

            <tr>
                <th>Claim ID</th>
                <th>Item ID</th>
                <th>Claim Date</th>
                <th>Status</th>
            </tr>

        </table>

    </fieldset>

    <br>

    <a href="dashboard.html">Back to Dashboard</a>

</body>
</html>
