<html>
<head>
    <title>UniLostFound - Report Item</title>
</head>

<body>

    <h1>UniLostFound</h1>

    <table width="100%" cellpadding="10">
        <tr>
            <td>
                <b>Report Lost/Found Item</b>
            </td>

            <td align="right">
                <a href="dashboard.html">Dashboard</a> |
                <a href="../profile.html">My Profile</a> |
                <a href="../login.html">Logout</a>
            </td>
        </tr>
    </table>

    <hr>

    <h2>Report an Item</h2>

    <form action="#" method="post" enctype="multipart/form-data">

        <fieldset>
            <legend><b>Item Information:</b></legend>

            <table cellpadding="8">

                <tr>
                    <td><b>Report Type</b></td>
                    <td>:
                        <input type="radio" name="item_type" value="Lost" required>
                        Lost

                        <input type="radio" name="item_type" value="Found">
                        Found
                    </td>
                </tr>

                <tr>
                    <td><b>Item Name</b></td>
                    <td>:
                        <input type="text" name="item_name" required>
                    </td>
                </tr>

                <tr>
                    <td><b>Category</b></td>
                    <td>:
                        <select name="category" required>
                            <option value="">Select Category</option>
                            <option>Electronics</option>
                            <option>Documents</option>
                            <option>Personal Items</option>
                            <option>Books</option>
                            <option>Accessories</option>
                            <option>Others</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><b>Description</b></td>
                    <td>:
                        <textarea
                            name="description"
                            rows="5"
                            cols="30"
                            placeholder="Describe the item"
                            required
                        ></textarea>
                    </td>
                </tr>

                <tr>
                    <td><b>Date</b></td>
                    <td>:
                        <input type="date" name="item_date" required>
                    </td>
                </tr>

                <tr>
                    <td><b>Location</b></td>
                    <td>:
                        <input
                            type="text"
                            name="location"
                            placeholder="Where was it lost/found?"
                            required
                        >
                    </td>
                </tr>

                <tr>
                    <td><b>Item Image</b></td>
                    <td>:
                        <input
                            type="file"
                            name="item_image"
                            accept="image/*"
                        >
                    </td>
                </tr>

            </table>

        </fieldset>

        <br>

        <input type="submit" value="Submit Report">
        <input type="reset" value="Clear">

    </form>

    <br>

    <a href="dashboard.html">Back to Dashboard</a>

</body>
</html>
