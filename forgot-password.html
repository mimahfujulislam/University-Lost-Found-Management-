<!DOCTYPE html>
<html>
<head>
    <title>UniLostFound - Forgot Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
        }

        a {
            text-decoration: none;
            color: #2563eb;
        }

        a:hover {
            color: #1d4ed8;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
        }

        .auth-logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 20px;
        }

        .auth-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 30px;
        }

        .auth-card h1 {
            text-align: center;
            color: #0f172a;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .auth-card p {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        fieldset {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 20px;
        }

        legend {
            color: #2563eb;
            font-weight: bold;
            padding: 0 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 8px 5px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
        }

        input[type="email"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .auth-footer p {
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .auth-page {
                padding: 15px;
            }

            .auth-card {
                padding: 20px;
            }

            td {
                display: block;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="auth-page">

        <div class="auth-container">

            <div class="auth-logo">
                UniLostFound
            </div>

            <div class="auth-card">

                <h1>Forgot Password?</h1>

                <p>
                    Enter your registered email address to reset your password.
                </p>

                <form action="#" method="post">

                    <fieldset>

                        <legend>Password Recovery</legend>

                        <table>

                            <tr>
                                <td>
                                    <label for="email">Email</label>
                                </td>

                                <td>
                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        placeholder="Enter your email"
                                        required
                                    >
                                </td>
                            </tr>

                            <tr>
                                <td colspan="2">

                                    <input
                                        type="submit"
                                        value="Send Reset Link"
                                        class="btn btn-primary"
                                    >

                                </td>
                            </tr>

                        </table>

                    </fieldset>

                </form>

                <div class="auth-footer">

                    <p>
                        Remember your password?
                        <a href="login.html">Sign In</a>
                    </p>

                    <p>
                        Don't have an account?
                        <a href="register.html">Register</a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
