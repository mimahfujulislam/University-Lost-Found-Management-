<html>
<head>
    <title>UniLostFound - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: #2563eb;
        }

        a:hover {
            color: #1d4ed8;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            padding: 30px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
        }

        .auth-logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 20px;
        }

        .auth-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 32px;
        }

        .auth-card h1 {
            text-align: center;
            color: #0f172a;
            font-size: 24px;
            margin-bottom: 7px;
        }

        .auth-card p {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            background: #ffffff;
            color: #1e293b;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        .remember-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .remember-row label {
            color: #475569;
        }

        .remember-row input {
            margin-right: 5px;
        }

        .btn {
            width: 100%;
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .auth-page {
                padding: 15px;
            }

            .auth-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-logo">
            UniLostFound
        </div>

        <div class="auth-card">

            <h1>Sign In</h1>

            <p>
                Sign in to access your UniLostFound account.
            </p>

            <form action="#" method="post">

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <div class="remember-row">

                    <label>
                        <input type="checkbox" name="remember">
                        Remember Me
                    </label>

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

                <input
                    type="submit"
                    value="Sign In"
                    class="btn btn-primary"
                >

            </form>

            <div class="auth-footer">

                Don't have an account?
                <a href="register.html">Register</a>

            </div>

        </div>

    </div>

</body>
</html>
